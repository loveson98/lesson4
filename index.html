<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b0d">
<title>Flashcards</title>
<style>
  :root {
    --bg: #0a0b0d;
    --bg-2: #0e1015;
    --surface: #13161b;
    --surface-2: #191d24;
    --border: #21252e;
    --border-2: #1a1e26;
    --text: #e8eaee;
    --text-2: #98a0ad;
    --text-3: #5a616d;
    --text-4: #3f4653;
    --accent: #3d5a73;
    --accent-2: #2a3a4a;
    --accent-en: #1a2430;
    --accent-en-text: #6d8ba8;
    --accent-np: #231c2b;
    --accent-np-text: #8b7a99;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans JP", "Noto Sans Devanagari", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    height: 100vh;
    height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* progress bar */
  .progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: #15181e;
    z-index: 50;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2a3a4a, #3d5a73);
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px 8px;
  }

  .deck-wrap {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 100%;
    max-height: 580px;
  }

  /* stacked deck cards behind */
  .deck-wrap::before,
  .deck-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    z-index: 0;
    pointer-events: none;
  }
  .deck-wrap::before {
    transform: translateY(9px) scale(0.955);
    opacity: 0.55;
  }
  .deck-wrap::after {
    transform: translateY(18px) scale(0.91);
    opacity: 0.28;
  }

  .deck {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    perspective: 1600px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.32, 0.72, 0, 1);
    will-change: transform;
  }

  .deck.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: linear-gradient(165deg, #16191f 0%, #0f1116 100%);
    border: 1px solid var(--border);
    box-shadow:
      0 24px 60px -28px rgba(0, 0, 0, 0.9),
      0 0 0 1px rgba(255, 255, 255, 0.015) inset;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .face.back {
    transform: rotateY(180deg);
  }

  /* ---------- FRONT ---------- */
  .front {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .jp {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #eef1f5;
    text-align: center;
    line-height: 1.25;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .kana {
    font-size: 15px;
    font-weight: 400;
    color: var(--text-2);
    margin-top: 14px;
    letter-spacing: 0.08em;
    text-align: center;
  }

  .tap-hint {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--text-4);
    animation: pulse 2.8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.85; }
  }

  /* ---------- BACK ---------- */
  .back {
    display: flex;
    flex-direction: column;
  }

  .back-scroll {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 26px 22px 30px;
  }

  .back-scroll::-webkit-scrollbar {
    width: 3px;
  }
  .back-scroll::-webkit-scrollbar-track {
    background: transparent;
  }
  .back-scroll::-webkit-scrollbar-thumb {
    background: #2a2f39;
    border-radius: 3px;
  }

  .meaning {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 7px 0;
  }

  .lang {
    flex: 0 0 auto;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.1em;
    padding: 4px 7px;
    border-radius: 5px;
    margin-top: 1px;
    line-height: 1;
  }

  .lang.en {
    background: var(--accent-en);
    color: var(--accent-en-text);
  }

  .lang.np {
    background: var(--accent-np);
    color: var(--accent-np-text);
  }

  .meaning-text {
    font-size: 15px;
    color: #d6dae1;
    line-height: 1.5;
    font-weight: 500;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
    margin: 20px 0 18px;
  }

  .examples-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-4);
    margin-bottom: 12px;
  }

  .ex {
    background: #12151a;
    border-left: 2px solid var(--accent-2);
    border-radius: 10px;
    padding: 13px 15px;
    margin-bottom: 9px;
  }

  .ex:last-child {
    margin-bottom: 0;
  }

  .ex-jp {
    font-size: 15px;
    font-weight: 600;
    color: #e3e6eb;
    line-height: 1.55;
  }

  .ex-en {
    font-size: 13px;
    color: #848c99;
    margin-top: 5px;
    line-height: 1.5;
  }

  .ex-np {
    font-size: 13px;
    color: #848c99;
    margin-top: 3px;
    line-height: 1.5;
  }

  /* ---------- BOTTOM ---------- */
  .bottom {
    flex-shrink: 0;
    padding: 4px 18px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .counter {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text-4);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .nav-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease, opacity 0.2s ease, border-color 0.18s ease;
    touch-action: manipulation;
  }

  .nav-btn svg {
    width: 20px;
    height: 20px;
  }

  .nav-btn:active:not(:disabled) {
    background: #1c2028;
    border-color: #2b313c;
    transform: scale(0.93);
  }

  .nav-btn:disabled {
    opacity: 0.22;
    cursor: default;
  }

  .nav-btn.spin svg {
    animation: spin 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(180deg); }
  }

  @media (max-height: 620px) {
    .bottom { gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .nav-btn { width: 48px; height: 48px; }
    .counter { font-size: 10px; }
    main { padding-top: 20px; }
  }
</style>
</head>
<body>

<div class="progress"><div class="progress-fill" id="progress"></div></div>

<main>
  <div class="deck-wrap">
    <div class="deck" id="deck">
      <div class="card-inner" id="cardInner">

        <!-- FRONT -->
        <div class="face front">
          <div class="jp" id="jp"></div>
          <div class="kana" id="kana"></div>
          <div class="tap-hint">Tap</div>
        </div>

        <!-- BACK -->
        <div class="face back">
          <div class="back-scroll" id="backScroll">
            <div class="meanings">
              <div class="meaning">
                <span class="lang en">EN</span>
                <span class="meaning-text" id="en"></span>
              </div>
              <div class="meaning">
                <span class="lang np">NP</span>
                <span class="meaning-text" id="np"></span>
              </div>
            </div>
            <div class="divider"></div>
            <div class="examples-label">Examples</div>
            <div class="examples" id="exList"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<div class="bottom">
  <div class="counter" id="counter"></div>
  <nav>
    <button class="nav-btn" id="prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button class="nav-btn" id="shuffle" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
    </button>
    <button class="nav-btn" id="next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </nav>
</div>

  ]}
];

/* ---------- state ---------- */
let order = DATA.map((_, i) => i);
let pos = 0;

const el = id => document.getElementById(id);
const deck = el('deck');
const cardInner = el('cardInner');

/* ---------- fit font to word length ---------- */
function fitFrontFont(item) {
  const front = document.querySelector('.front');
  const avail = Math.max(front.clientWidth - 48, 120);
  const n = Math.max(item.jp.length, 1);
  let size = Math.floor(avail / n);
  size = Math.min(size, 46);
  size = Math.max(size, 20);
  el('jp').style.fontSize = size + 'px';
}

/* ---------- render ---------- */
function render() {
  const item = DATA[order[pos]];

  // snap back if currently flipped (no animation while swapping content)
  if (deck.classList.contains('flipped')) {
    cardInner.style.transition = 'none';
    deck.classList.remove('flipped');
    void cardInner.offsetHeight;
    cardInner.style.transition = '';
  }

  el('jp').textContent = item.jp;
  el('kana').textContent = item.read;
  el('en').textContent = item.en;
  el('np').textContent = item.np;

  const list = el('exList');
  list.innerHTML = '';
  item.ex.forEach(e => {
    const d = document.createElement('div');
    d.className = 'ex';

    const jp = document.createElement('div');
    jp.className = 'ex-jp';
    jp.textContent = e.jp;

    const en = document.createElement('div');
    en.className = 'ex-en';
    en.textContent = e.en;

    const np = document.createElement('div');
    np.className = 'ex-np';
    np.textContent = e.np;

    d.append(jp, en, np);
    list.appendChild(d);
  });

  el('backScroll').scrollTop = 0;
  fitFrontFont(item);

  el('counter').textContent = (pos + 1) + ' / ' + order.length;
  el('progress').style.width = ((pos + 1) / order.length * 100) + '%';

  el('prev').disabled = pos === 0;
  el('next').disabled = pos === order.length - 1;
}

/* ---------- interactions ---------- */
deck.addEventListener('click', () => {
  deck.classList.toggle('flipped');
});

el('prev').addEventListener('click', e => {
  e.stopPropagation();
  if (pos > 0) { pos--; render(); }
});

el('next').addEventListener('click', e => {
  e.stopPropagation();
  if (pos < order.length - 1) { pos++; render(); }
});

el('shuffle').addEventListener('click', e => {
  e.stopPropagation();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();

  const btn = el('shuffle');
  btn.classList.add('spin');
  setTimeout(() => btn.classList.remove('spin'), 500);
});

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && pos > 0) { pos--; render(); }
  else if (e.key === 'ArrowRight' && pos < order.length - 1) { pos++; render(); }
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    deck.classList.toggle('flipped');
  }
});

/* resize */
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => fitFrontFont(DATA[order[pos]]), 120);
});

/* init */
render();
</script>
